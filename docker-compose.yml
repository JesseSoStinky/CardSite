version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tcg
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  createbucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 minio minio123;
        mc mb --ignore-existing local/tcg-marketplace;
        exit 0;
      "

  migrate:
    build: .
    command: ["pnpm", "prisma", "migrate", "deploy"]
    env_file:
      - .env.local
    depends_on:
      - db

  web:
    build: .
    restart: always
    command: ["pnpm", "start"]
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      - db
      - minio

volumes:
  db-data:
  minio-data:
